    type: 'text', x, y, text, color: color || '#ffe3a8',
    size: size || 18, life: 1, vy: -1.5, vx: rnd(-0.4, 0.4),
  });
}

function sparks(x, y, color, n) {
  for (let i = 0; i < (n || 8); i++) {
    const a = rnd(0, TAU), v = rnd(1.2, 5);
    G.particles.push({
      type: 'spark', x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      color: color || '#ffc94d', life: 1, size: rnd(1.5, 3.5),
    });
  }
}

function updateParticles(dt) {
  const dtf = dt / 16.667;
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= 0.022 * dtf;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    p.x += (p.vx || 0) * dtf;
    p.y += (p.vy || 0) * dtf;
    if (p.type === 'spark') {
      p.vy += 0.22 * dtf;
      p.vx *= 0.96;
    } else {
      p.vy *= 0.97;
    }
  }
}

function drawParticles() {
  for (const p of G.particles) {
    const a = clamp(p.life, 0, 1);
    if (p.type === 'text') {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = `600 ${p.size}px -apple-system, "PingFang SC", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(0,0,0,0.42)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = a * 0.9;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }
}

/* ============================================================
   游戏实体：落叶（独立于主场景，避免互相污染）
   ============================================================ */
const leafSprites = new Map();

function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = 255 * pct / 100;
  r = clamp(Math.round(r + f), 0, 255);
  g = clamp(Math.round(g + f), 0, 255);
  b = clamp(Math.round(b + f), 0, 255);
  return `rgb(${r},${g},${b})`;
}

function makeLeafSprite(type, size, color) {
  const s = Math.round(size);
  const key = type + '_' + s + '_' + color;
  let spr = leafSprites.get(key);
  if (spr) return spr;

  const pad = s * 1.4;
  const dim = Math.ceil(pad * 2);
  const c = document.createElement('canvas');
  c.width = c.height = dim;
  const g2 = c.getContext('2d');
  g2.translate(pad, pad);

  const lobes = type === 0 ? 5 : type === 1 ? 3 : 4;
  const STEPS = 72;
  g2.beginPath();
  for (let i = 0; i <= STEPS; i++) {
    const a = (i / STEPS) * TAU - Math.PI / 2;
    const lobe = 0.55 + 0.45 * Math.pow(Math.abs(Math.cos(a * lobes / 2)), 0.75);
    const serr = 1 + 0.055 * Math.sin(a * lobes * 6);
    const r = s * lobe * serr;
    const px = Math.cos(a) * r * 0.80;
    const py = Math.sin(a) * r * 1.00;
    if (i === 0) g2.moveTo(px, py); else g2.lineTo(px, py);
  }
  g2.closePath();

  const grd = g2.createLinearGradient(0, -s, 0, s);
  grd.addColorStop(0, shade(color, 8));
  grd.addColorStop(1, shade(color, -22));
  g2.fillStyle = grd;
  g2.fill();

  if (s > 10) {
    g2.strokeStyle = 'rgba(60, 24, 4, 0.26)';
    g2.lineWidth = Math.max(0.55, s * 0.032);
    g2.beginPath();
    g2.moveTo(0, -s * 1.0); g2.lineTo(0, s * 0.9);
    g2.moveTo(0, 0); g2.lineTo(-s * 0.42, -s * 0.42);
    g2.moveTo(0, 0); g2.lineTo(s * 0.42, -s * 0.42);
    g2.stroke();
  }

  leafSprites.set(key, c);
  return c;
}

const LEAF_COLORS = ['#c0562a','#d4692b','#e08b34','#b8451f','#cf7a2c',
                     '#9c4a1e','#e2a047','#a85a24','#d97b3a'];
const GOLD_COLORS = ['#f5c542','#ffd96b','#e8a92c','#ffcf45'];

function spawnLeaf(opts = {}) {
  const special = opts.special || (Math.random() < 0.09);
  const size = special ? rnd(24, 34) : rnd(14, 24);
  const color = special ? pick(GOLD_COLORS) : pick(LEAF_COLORS);

  return {
    x: opts.x != null ? opts.x : rnd(40, W - 40),
    y: opts.y != null ? opts.y : -40,
    vx: opts.vx != null ? opts.vx : rnd(-0.3, 0.3),
    vy: opts.vy != null ? opts.vy : rnd(1.0, 2.4),
    size,
    color,
    special,
    shape: rndI(0, 2),
    ang: rnd(0, TAU),
    spin: rnd(-0.03, 0.03),
    flip: rnd(0, TAU),
    flipSp: rnd(0.01, 0.04),
    ph: rnd(0, TAU),
    phSp: rnd(0.02, 0.05),
    scale: 0,
    hit: false,
    scored: false,
    // 被风推动
    fx: 0, fy: 0,
  };
}

let W = window.innerWidth, H = window.innerHeight;
function syncSize() { W = window.innerWidth; H = window.innerHeight; }
window.addEventListener('resize', syncSize);

function drawLeafItem(p) {
  const spr = makeLeafSprite(p.shape, p.size, p.color);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.ang);
  ctx.scale(Math.cos(p.flip) * p.scale, p.scale);
  ctx.drawImage(spr, -spr.width / 2, -spr.height / 2);
  ctx.restore();

  // 金叶外发光
  if (p.special) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const r = p.size * 1.5;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, 'rgba(255, 214, 90, 0.32)');
    g.addColorStop(1, 'rgba(255, 214, 90, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   游戏一：接落叶
   ============================================================ */
const CATCH = {
  spawnTimer: 0,
  spawnInterval: 620,
  missed: 0,

  start() {
    G.score = 0;
    G.combo = 0;
    G.lives = 3;
    this.missed = 0;
    this.spawnTimer = 0;
    this.spawnInterval = 620;
    G.items = [];
    G.basket.w = clamp(W * 0.12, 90, 170);
    G.basket.x = W / 2;
    G.basket.targetX = W / 2;
    G.basket.y = H - 78;
    // 先铺几片
    for (let i = 0; i < 5; i++) {
      const l = spawnLeaf({ y: rnd(-H * 0.5, H * 0.35) });
      l.vy = rnd(1.0, 2.2);
      G.items.push(l);
    }
  },

  update(dt) {
    const dtf = dt / 16.667;

    // 篮筐跟随指针
    const _ptr = bridge.ptr;
    if (_ptr.x > -9000) G.basket.targetX = _ptr.x;
    G.basket.x += (G.basket.targetX - G.basket.x) * 0.22 * dtf;
    G.basket.x = clamp(G.basket.x, G.basket.w / 2, W - G.basket.w / 2);

    // 生成
    this.spawnTimer += dt;
    // 难度随时间上升
    const progress = 1 - G.timeLeft / G.duration;
    this.spawnInterval = lerp(620, 300, progress);
    if (this.spawnTimer > this.spawnInterval) {
      this.spawnTimer = 0;
      G.items.push(spawnLeaf({ vy: rnd(1.2, 2.4) * lerp(1, 1.55, progress) }));
    }

    const bw = G.basket.w;
    const by = G.basket.y;
    const bh = 26;

    for (let i = G.items.length - 1; i >= 0; i--) {
      const p = G.items[i];
      if (p.scale < 1) p.scale = Math.min(1, p.scale + 0.09 * dtf);

      p.ph += p.phSp * dtf;
      p.ang += p.spin * dtf;
      p.flip += p.flipSp * dtf;

      p.x += (p.vx + Math.sin(p.ph) * 0.55 + p.fx) * dtf;
      p.y += (p.vy + p.fy) * dtf;
      p.fx *= 0.95; p.fy *= 0.95;

      // 接住判定
      if (!p.scored) {
        const inX = Math.abs(p.x - G.basket.x) < bw * 0.52;
        const inY = p.y > by - bh && p.y < by + bh * 1.6;
        if (inX && inY) {
          p.scored = true;
          G.items.splice(i, 1);
          this.hit(p);
          continue;
        }
      }

      // 落地漏接
      if (p.y > H + 40) {
        G.items.splice(i, 1);
        if (!p.scored) this.miss(p);
      }
    }
  },

  hit(p) {
    const base = p.special ? 5 : 1;
    G.combo++;
    if (G.combo > 0 && G.combo % 5 === 0) {
      const bonus = Math.floor(G.combo / 5) * 2;
      G.score += base + bonus;
      floatText(p.x, p.y - 14, `连击 ${G.combo}  +${base + bonus}`, '#ffd86b', 20);
      sparks(p.x, p.y, '#ffd86b', 16);
    } else {
      G.score += base;
      floatText(p.x, p.y - 14, `+${base}`, p.special ? '#ffd86b' : '#ffe9c0', p.special ? 22 : 16);
      sparks(p.x, p.y, p.special ? '#ffd86b' : '#ffb347', p.special ? 14 : 6);
    }
    bridge.beep(p.special ? 880 : 620, 0.06, p.special ? 0.1 : 0.06);
    updateScoreUI();
    showCombo(G.combo);
  },

  miss(p) {
    this.missed++;
    G.combo = 0;
    showCombo(0);
    G.lives--;
    G.shake = 6;
    G.flash = 0.28;
    floatText(p.x, H - 110, '漏接', '#ff8a6e', 15);
    bridge.beep(180, 0.12, 0.06, 'sawtooth');
    if (G.lives <= 0) {
      endGame();
    }
  },

  draw() {
    // 落点阴影线（帮助判断）
    ctx.save();
    ctx.globalAlpha = 0.16;
    const grd = ctx.createLinearGradient(G.basket.x, H - 120, G.basket.x, H);
    grd.addColorStop(0, 'rgba(255,200,120,0)');
    grd.addColorStop(1, 'rgba(255,200,120,0.5)');
    ctx.fillStyle = grd;
    ctx.fillRect(G.basket.x - G.basket.w * 0.5, H - 120, G.basket.w, 120);
    ctx.restore();

    // 篮子
    const bx = G.basket.x, by = G.basket.y, bw = G.basket.w;
    ctx.save();
    ctx.translate(bx, by);

    // 篮子主体（梯形）
    const topW = bw, botW = bw * 0.74, hh = 46;
    ctx.beginPath();
    ctx.moveTo(-topW / 2, 0);
    ctx.lineTo(topW / 2, 0);
    ctx.lineTo(botW / 2, hh);
    ctx.lineTo(-botW / 2, hh);
    ctx.closePath();
    const bg = ctx.createLinearGradient(0, 0, 0, hh);
    bg.addColorStop(0, '#b5763c');
    bg.addColorStop(0.5, '#9a5f2c');
    bg.addColorStop(1, '#7a4620');
    ctx.fillStyle = bg;
    ctx.fill();

    // 编织纹
    ctx.strokeStyle = 'rgba(60, 30, 8, 0.28)';
    ctx.lineWidth = 1.5;
    for (let i = 1; i < 4; i++) {
      const y = (hh / 4) * i;
      const w2 = lerp(topW, botW, i / 4) / 2;
      ctx.beginPath();
      ctx.moveTo(-w2, y);
      ctx.lineTo(w2, y);
      ctx.stroke();
    }
    // 竖向编织
    for (let i = 1; i < 7; i++) {
      const t = i / 7;
      ctx.beginPath();
      ctx.moveTo(lerp(-topW / 2, topW / 2, t), 0);
      ctx.lineTo(lerp(-botW / 2, botW / 2, t), hh);
      ctx.stroke();
    }

    // 篮口
    ctx.beginPath();
    ctx.ellipse(0, 0, topW / 2, 8, 0, 0, TAU);
    const rimG = ctx.createLinearGradient(-topW / 2, 0, topW / 2, 0);
    rimG.addColorStop(0, '#d4924f');
    rimG.addColorStop(0.5, '#c07f3d');
    rimG.addColorStop(1, '#a2662c');
    ctx.fillStyle = rimG;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 220, 170, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 高光
    ctx.beginPath();
    ctx.ellipse(-topW * 0.2, 0, topW * 0.16, 4, 0, 0, TAU);
    ctx.fillStyle = 'rgba(255, 235, 200, 0.3)';
    ctx.fill();

    ctx.restore();

    // 生命值
    ctx.save();
    ctx.translate(bx, by + 68);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc((i - 1) * 16, 0, 4.5, 0, TAU);
      ctx.fillStyle = i < G.lives ? 'rgba(255, 200, 120, 0.95)' : 'rgba(255,255,255,0.18)';
      ctx.fill();
    }
    ctx.restore();
  },
};

/* ============================================================
   游戏二：吹叶入篮
   ============================================================ */
const BASKET = {
  spawnTimer: 0,
  leaves: [],

  start() {
    G.score = 0;
    G.combo = 0;
    this.spawnTimer = 0;
    this.leaves = [];
    G.hoop.r = clamp(W * 0.055, 46, 78);
    G.hoop.x = W - G.hoop.r - 70;
    G.hoop.y = G.hoop.r + 96;

    for (let i = 0; i < 22; i++) {
      const l = spawnLeaf({ x: rnd(60, W * 0.7), y: rnd(H * 0.25, H * 0.95) });
      l.vy = rnd(0.15, 0.5);
      l.vx = rnd(-0.1, 0.4);
      l.scale = 1;
      this.leaves.push(l);
    }
    G.items = this.leaves;   // 暴露给调试/测试
  },

  update(dt) {
    const dtf = dt / 16.667;

    // —— 鼠标风场：把落叶往指针运动方向推 ——
    const _ptr = bridge.ptr;
    const powerT = (bridge.state.power || 45) / 100;
    const windR = lerp(90, 300, powerT);
    if (_ptr.speed > 0.8) {
      const force = clamp(_ptr.speed / 24, 0, 1.7) * lerp(0.5, 3.2, powerT * powerT);
      const _R2 = windR * windR;
      for (const p of this.leaves) {
        const dx = p.x - _ptr.x, dy = p.y - _ptr.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > _R2) continue;
        const d = Math.sqrt(d2) || 0.001;
        const t = 1 - d / windR;
        const fall = t * t;
        p.fx += (dx / d * 0.4 + _ptr.vx / 18 * 1.0) * fall * force * 11;
        p.fy += (dy / d * 0.4 + _ptr.vy / 18 * 1.0) * fall * force * 11;
      }
    }

    // 补充落叶
    this.spawnTimer += dt;
    if (this.spawnTimer > 420 && this.leaves.length < 26) {
      this.spawnTimer = 0;
      const l = spawnLeaf({ x: rnd(40, W * 0.6), y: rnd(-60, H * 0.3) });
      l.vy = rnd(0.15, 0.5);
      l.scale = 1;
      this.leaves.push(l);
    }

    const hoop = G.hoop;
    const R = hoop.r;

    for (let i = this.leaves.length - 1; i >= 0; i--) {
      const p = this.leaves[i];
      if (p.scale < 1) p.scale = Math.min(1, p.scale + 0.08 * dtf);

      p.ph += p.phSp * dtf;
      p.ang += p.spin * dtf;
      p.flip += p.flipSp * dtf;

      // 环境漂移
      const drift = Math.sin(p.ph) * 0.22;
      p.x += (p.vx + drift + p.fx) * dtf;
      p.y += (p.vy + p.fy) * dtf;

      // 阻尼
      p.fx *= 0.975; p.fy *= 0.975;

      // 边界回弹（保持在场内，方便吹）
      const m = 20;
      if (p.x < m) { p.x = m; p.fx = Math.abs(p.fx) * 0.5; }
      if (p.x > W - m) { p.x = W - m; p.fx = -Math.abs(p.fx) * 0.5; }
      if (p.y < m) { p.y = m; p.fy = Math.abs(p.fy) * 0.5; }
      if (p.y > H - m) { p.y = H - m; p.fy = -Math.abs(p.fy) * 0.5; }

      // 进入篮圈判定
      const dx = p.x - hoop.x, dy = p.y - hoop.y;
      const dist = Math.hypot(dx, dy);
      if (dist < R * 0.86) {
        const base = p.special ? 30 : 10;
        G.score += base;
        G.combo++;
        this.leaves.splice(i, 1);
        floatText(hoop.x, hoop.y - R - 10, `+${base}`, p.special ? '#ffd86b' : '#a8e6a0', p.special ? 24 : 18);
        sparks(hoop.x, hoop.y, p.special ? '#ffd86b' : '#a8e6a0', p.special ? 20 : 10);
        hoop.pulse = 1;
        bridge.beep(p.special ? 1040 : 720, 0.08, 0.08);
        updateScoreUI();
        showCombo(G.combo);
        // 重置回中
        const l = spawnLeaf({ x: rnd(60, W * 0.6), y: rnd(H * 0.2, H * 0.8) });
        l.vy = rnd(0.15, 0.5);
        l.scale = 1;
        this.leaves.push(l);
      }
    }

    if (hoop.pulse) hoop.pulse = Math.max(0, hoop.pulse - 0.045 * dtf);
  },

  drawWindAura() {
    // 风力可视化
    const p = bridge.ptr;
    if (p.speed < 3) return;
    const t = clamp(p.speed / 26, 0, 1);
    const R = lerp(80, 240, bridge.state.power / 100);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const a = Math.atan2(p.vy, p.vx) + (i - 2) * 0.18;
      const off = (performance.now() * 0.25 + i * 40) % 160;
      const sx = p.x + Math.cos(a) * off;
      const sy = p.y + Math.sin(a) * off;
      ctx.globalAlpha = (1 - off / 160) * 0.18 * t;
      ctx.strokeStyle = '#ffe0a8';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - Math.cos(a) * 34, sy - Math.sin(a) * 34);
      ctx.stroke();
    }
    ctx.restore();
  },

  draw() {
    this.drawWindAura();

    // 篮圈
    const h = G.hoop;
    const R = h.r * (1 + (h.pulse || 0) * 0.12);
    ctx.save();
    ctx.translate(h.x, h.y);

    // 光晕
    ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 1.7);
    gg.addColorStop(0, `rgba(255, 210, 120, ${0.14 + (h.pulse || 0) * 0.2})`);
    gg.addColorStop(1, 'rgba(255, 210, 120, 0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(0, 0, R * 1.7, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // 圈
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, TAU);
    ctx.strokeStyle = h.pulse ? 'rgba(255, 235, 170, 0.95)' : 'rgba(255, 220, 150, 0.62)';
    ctx.lineWidth = 3 + (h.pulse || 0) * 3;
    ctx.stroke();

    // 内虚线
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.86, 0, TAU);
    ctx.setLineDash([5, 7]);
    ctx.strokeStyle = 'rgba(255, 220, 150, 0.3)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.setLineDash([]);

    // 四角标记
    ctx.strokeStyle = 'rgba(255, 235, 180, 0.75)';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * TAU + Math.PI / 4;
      const l = R * 1.12;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * l, Math.sin(a) * l);
      ctx.lineTo(Math.cos(a) * (l + 12), Math.sin(a) * (l + 12));
      ctx.stroke();
    }

    // 文字
    ctx.font = '600 11px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(255, 228, 170, 0.7)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('篮 圈', 0, 0);

    ctx.restore();
  },

  leavesRef() { return this.leaves; },
};

/* ============================================================
   游戏三：点落叶连击
   ============================================================ */
const COMBO = {
  spawnTimer: 0,

  start() {
    G.score = 0;
    G.combo = 0;
    G.comboWindow = 1200;
    G.items = [];
    this.spawnTimer = 0;
    for (let i = 0; i < 8; i++) {
      const l = spawnLeaf({ x: rnd(80, W - 80), y: rnd(80, H - 120) });
      l.scale = 1;
      l.vy = rnd(0.3, 1.0);
      l.vx = rnd(-0.5, 0.5);
      G.items.push(l);
    }
  },

  update(dt) {
    const dtf = dt / 16.667;

    this.spawnTimer += dt;
    const target = 12;
    if (G.items.length < target && this.spawnTimer > 380) {
      this.spawnTimer = 0;
      const l = spawnLeaf({ x: rnd(80, W - 80), y: rnd(-60, H * 0.2) });
      l.scale = 1;
      l.vy = rnd(0.4, 1.1);
      l.vx = rnd(-0.6, 0.6);
      G.items.push(l);
    }

    // 连击计时
    if (G.combo > 0) {
      G.comboTimer -= dt;
      if (G.comboTimer <= 0) {
        G.combo = 0;
        showCombo(0);
        updateScoreUI();
      } else {
        // 进度条颜色的紧迫感
        updateComboBar();
      }
    }

    for (let i = G.items.length - 1; i >= 0; i--) {
      const p = G.items[i];
      if (p.scale < 1) p.scale = Math.min(1, p.scale + 0.1 * dtf);
      p.ph += p.phSp * dtf;
      p.ang += p.spin * dtf;
      p.flip += p.flipSp * dtf;

      // 游走 + 轻微追踪（增加难度）
      p.x += (p.vx + Math.sin(p.ph) * 0.9 + p.fx) * dtf;
      p.y += (p.vy + Math.cos(p.ph * 0.7) * 0.5 + p.fy) * dtf;
      p.fx *= 0.94; p.fy *= 0.94;

      // 边界回绕
      if (p.x < 30) { p.x = 30; p.vx = Math.abs(p.vx); }
      if (p.x > W - 30) { p.x = W - 30; p.vx = -Math.abs(p.vx); }
      if (p.y > H + 50) { G.items.splice(i, 1); continue; }
      if (p.y < -60) { p.y = -60; p.vy = Math.abs(p.vy); }

      // 存活时间（防止一直留着）
      p.life = (p.life == null ? 1 : p.life);
      p.age = (p.age || 0) + dt;
      if (p.age > 12000) {
        G.items.splice(i, 1);
      }
    }
  },

  // 点击处理
  onClick(x, y) {
    // 从后往前找最上层的命中
    let hitIdx = -1, hitP = null;
    for (let i = G.items.length - 1; i >= 0; i--) {
      const p = G.items[i];
      const r = p.size * 1.15;
      if (Math.hypot(p.x - x, p.y - y) < r) {
        hitIdx = i;
        hitP = p;
        break;
      }
    }

    if (hitIdx < 0) {
      // 点空：连击清零
      if (G.combo > 0) {
        floatText(x, y, 'MISS', '#ff8a6e', 15);
        bridge.beep(160, 0.1, 0.05, 'sawtooth');
      }
      G.combo = 0;
      showCombo(0);
      updateScoreUI();
      return false;
    }

    G.items.splice(hitIdx, 1);
    G.combo++;
    G.comboTimer = G.comboWindow + (hitP.special ? 400 : 0);

    const mult = 1 + Math.floor(G.combo / 5) * 0.5;
    const base = hitP.special ? 5 : 1;
    const gain = Math.round(base * mult);
    G.score += gain;

    floatText(hitP.x, hitP.y - 10,
      hitP.special ? `金叶 +${gain}` : `+${gain}`,
      hitP.special ? '#ffd86b' : '#ffe9c0',
      hitP.special ? 21 : 15);
    sparks(hitP.x, hitP.y, hitP.special ? '#ffd86b' : '#ffb347', hitP.special ? 16 : 8);

    if (G.combo > 1 && G.combo % 5 === 0) {
      floatText(hitP.x, hitP.y - 40, `${G.combo} 连击!`, '#ff9ec4', 22);
    }

    bridge.beep(520 + Math.min(G.combo, 20) * 26, 0.05, 0.055);
    updateScoreUI();
    showCombo(G.combo);
    return true;
  },

  draw() {
    // 连击进度环在指针处
    if (G.combo > 0) {
      const t = clamp(G.comboTimer / G.comboWindow, 0, 1);
      const p = bridge.ptr;
      if (p.x > -9000) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 26, -Math.PI / 2, -Math.PI / 2 + TAU * t);
        ctx.strokeStyle = t > 0.35 ? 'rgba(255, 220, 140, 0.85)' : 'rgba(255, 130, 100, 0.9)';
        ctx.lineWidth = 2.6;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();
      }
    }
  },
};

/* ============================================================
   桥接：主引擎暴露的接口
   ============================================================ */
const bridge = {
  get ptr() { return window.__ptr || { x: -9999, y: -9999, vx: 0, vy: 0, speed: 0 }; },
  get state() { return window.__state || {}; },
  beep(freq, dur, vol, type) {
    if (window.__beep) window.__beep(freq, dur, vol, type);
  },
};

/* ============================================================
   UI 更新
   ============================================================ */
function updateScoreUI() {
  ghScore.textContent = G.score;
  if (G.mode === 'catch') {
    ghGoal.textContent = `剩余生命 ${Math.max(0, G.lives)}`;
  }
}

function showCombo(n) {
  if (n >= 2) {
    ghCombo.textContent = `${n} 连击`;
    ghCombo.classList.add('show');
    ghCombo.classList.remove('pop');
    void ghCombo.offsetWidth;
    ghCombo.classList.add('pop');
  } else {
    ghCombo.classList.remove('show');
  }
}

function updateComboBar() {
  // 连击剩余时间用一条细进度显示在分数下方
  const t = clamp(G.comboTimer / G.comboWindow, 0, 1);
  ghCombo.style.opacity = G.combo > 0 ? String(0.35 + t * 0.65) : '0';
}

function setTimerUI() {
  const s = Math.max(0, G.timeLeft / 1000);
  ghTimer.textContent = s.toFixed(1);
  const t = clamp(G.timeLeft / G.duration, 0, 1);
  ghBar.style.transform = `scaleX(${t})`;
  ghBar.style.background = t < 0.2 ? '#ff8a6e' : '';
  ghTimer.classList.toggle('urgent', s < 6 && G.phase === 'playing');
}

/* ============================================================
   开始 / 结束
   ============================================================ */
let rafId = null;

function openCard(mode, isOver) {
  const g = GAMES[mode];
  gcIcon.textContent = g.icon;
  gcTitle.textContent = isOver ? '游戏结束' : g.name;

  if (isOver) {
    const best = bests[mode] || 0;
    const isNew = G.score > best;
    if (isNew) {
      bests[mode] = G.score;
      saveBest(bests);
      refreshBestLabels();
    }
    gcDesc.innerHTML = '';
    gcDesc.textContent = '';
    gcRules.innerHTML = '';
    gcBest.innerHTML = `本局 <strong>${G.score}</strong> 分` +
      (isNew ? ' &nbsp;·&nbsp; 🎉 新纪录！' : ` &nbsp;·&nbsp; 最高 ${best}`);
    gcStart.textContent = '再来一局';
  } else {
    gcDesc.textContent = g.desc;
    gcRules.innerHTML = g.rules
      .map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`)
      .join('');
    const best = bests[mode];
    gcBest.innerHTML = best ? `最高纪录 <strong>${best}</strong>` : '';
    gcStart.textContent = '开始游戏';
  }

  gameCard.classList.add('show');
}

function closeCard() {
  gameCard.classList.remove('show');
}

function startGame(mode) {
  G.mode = mode;
  G.phase = 'playing';
  G.active = true;
  G.duration = GAMES[mode].duration * 1000;
  G.timeLeft = G.duration;
  G.score = 0;
  G.combo = 0;
  G.comboTimer = 0;
  G.particles = [];
  G.shake = 0;
  G.flash = 0;

  ghName.textContent = GAMES[mode].name;
  ghGoal.textContent = GAMES[mode].goal;
  ghScore.textContent = '0';
  ghCombo.classList.remove('show');
  gameHud.classList.add('show');
  document.body.classList.add('playing');
  closeCard();

  if (mode === 'catch') { CATCH.start(); updateScoreUI(); }
  else if (mode === 'basket') BASKET.start();
  else COMBO.start();

  setTimerUI();
  lastGameT = performance.now();
  if (!rafId) rafId = requestAnimationFrame(gameLoop);
}

function endGame() {
  G.phase = 'over';
  G.active = false;
  gameHud.classList.remove('show');
  document.body.classList.remove('playing');
  openCard(G.mode, true);
  bridge.beep(440, 0.3, 0.09, 'sine');
}

function quitGame() {
  G.phase = 'idle';
  G.active = false;
  G.mode = null;
  G.items = [];
  BASKET.leaves = [];
  G.particles = [];
  gameHud.classList.remove('show');
  gameCard.classList.remove('show');
  document.body.classList.remove('playing');
  ghCombo.classList.remove('show');
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  window.__gameActive = false;
}

/* ============================================================
   主循环
   ============================================================ */
let lastGameT = performance.now();

function gameLoop(now) {
  const dt = clamp(now - lastGameT, 6, 46);
  lastGameT = now;

  if (G.phase !== 'playing') {
    // 结束后仍绘制残留，让画面不闪
    if (G.phase === 'over') {
      ctx.save();
      if (G.mode === 'basket') {
        for (const l of BASKET.leavesRef()) drawLeafItem(l);
        BASKET.draw();
      }
      ctx.restore();
      drawParticles();
      updateParticles(dt);
      requestAnimationFrame(gameLoop);
      return;
    }
    rafId = null;
    return;
  }

  // 倒计时
  G.timeLeft -= dt;
  setTimerUI();
  if (G.timeLeft <= 0) {
    G.timeLeft = 0;
    setTimerUI();
    endGame();
    rafId = requestAnimationFrame(gameLoop);
    return;
  }

  // 更新
  if (G.mode === 'catch') CATCH.update(dt);
  else if (G.mode === 'basket') BASKET.update(dt);
  else COMBO.update(dt);

  updateParticles(dt);

  // 震屏 / 闪白衰减
  if (G.shake > 0) G.shake = Math.max(0, G.shake - 0.5 * dt / 16.667);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - 0.02 * dt / 16.667);

  // —— 绘制（在主场景之上叠加）——
  ctx.save();
  if (G.shake > 0.1) {
    ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  }

  if (G.mode === 'catch') {
    for (const p of G.items) drawLeafItem(p);
    CATCH.draw();
  } else if (G.mode === 'basket') {
    for (const l of BASKET.leavesRef()) drawLeafItem(l);
    BASKET.draw();
  } else {
    for (const p of G.items) drawLeafItem(p);
    COMBO.draw();
  }

  drawParticles();
  ctx.restore();

  // 漏接闪光
  if (G.flash > 0) {
    ctx.save();
    ctx.globalAlpha = G.flash;
    ctx.fillStyle = '#ff5544';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  rafId = requestAnimationFrame(gameLoop);
}

/* ============================================================
   事件绑定
   ============================================================ */
document.querySelectorAll('.game-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.game;
    G.mode = mode;
    G.phase = 'ready';
    openCard(mode, false);
  });
});

gcStart.addEventListener('click', () => {
  if (G.mode) startGame(G.mode);
});

gcQuit.addEventListener('click', () => {
  quitGame();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (gameCard.classList.contains('show')) {
      if (G.phase === 'ready') quitGame();
      else closeCard();
    } else if (G.phase === 'playing') {
      endGame();
    }
  }
  // 游戏中空格 = 暂停/结束提示，避免误触主场景大招
  if (e.key === ' ' && G.phase === 'playing') {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

/* ---- 点击：游戏中由游戏接管 ---- */
window.addEventListener('pointerdown', e => {
  if (!G.active || G.phase !== 'playing') return;
  if (e.target.closest('.panel, .panel-toggle, .stats, .game-card, .game-hud')) return;

  if (G.mode === 'combo') {
    e.stopPropagation();
    e.preventDefault();
    COMBO.onClick(e.clientX, e.clientY);
  }
}, true); // capture 阶段，优先于主场景的点击爆炸

/* ---- 阻止游戏中主场景的点击爆炸 ---- */
window.addEventListener('pointerdown', e => {
  if (G.active && G.phase === 'playing') {
    if (!e.target.closest('.panel, .panel-toggle, .stats, .game-card, .game-hud')) {
      e.stopImmediatePropagation();
    }
  }
}, false);

/* ============================================================
   最高分标签
   ============================================================ */
function refreshBestLabels() {
  document.querySelectorAll('.g-best').forEach(el => {
    const k = el.dataset.best;
    el.textContent = bests[k] ? `最高 ${bests[k]}` : '—';
  });
}
refreshBestLabels();

/* 暴露供主引擎查询 */
window.__GameModule = {
  isActive() { return G.active && G.phase === 'playing'; },
  getMode() { return G.mode; },
  quit: quitGame,
  syncSize,
};
window.__G = G;          // 调试/测试用

})();

</script>
